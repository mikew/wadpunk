[package]
name = "wadpunk"
version = "0.0.0"
description = "A wad organizer / Source Port manager inspired by Doom Launcher"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-graphql = { git = "https://github.com/mikew/tauri-plugin-graphql", branch = "tauri-2-latest" }
async-graphql = "7.0.17"
chrono = "0.4.41"
plist = "1.7.2"
tauri-plugin-window-state = "2"
fs_extra = "1.3.0"
tauri-plugin-cli = "2.3.0"
# tauri-plugin-cli = { path = "/Users/mike/Work/plugins-workspace/plugins/cli" }
once_cell = "1.21.3"
tauri-plugin-process = "2.2.1"
tauri-plugin-shell = "2.2.1"
tauri-plugin-opener = "2.2.7"
tauri-plugin-single-instance = "2.2.4"
tauri-plugin-deep-link = "2.4.0"
tokio = "1.46.1"
thiserror = "2.0.12"
reqwest = { version = "0.12.22", default-features = false, features = [
  "macos-system-configuration",
  # "json",
  "stream",
] }
futures-util = "0.3.31"
mktemp = "0.5.1"
roxmltree = "0.20.0"
tauri-plugin-os = "2.3.0"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# Strip expensive panic clean-up logic
panic = "abort"
# Compile crates one after another so the compiler can optimize better
codegen-units = 1
# Enables link to optimizations
lto = true
# Optimize for binary size
opt-level = "s"
# Remove debug symbols
strip = true

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = "2"

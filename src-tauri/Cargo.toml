[package]
name = "wadpunk"
version = "0.0.0"
description = "A wad organizer / GZDoom launcher inspired by Doom Launcher"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-graphql = { git = "https://github.com/mikew/tauri-plugin-graphql", branch = "tauri-2-latest" }
async-graphql = "7.0.17"
chrono = "0.4.41"
plist = "1.7.2"
tauri-plugin-window-state = "2"
fs_extra = "1.3.0"
tauri-plugin-cli = "2.2.0"
once_cell = "1.21.3"
tauri-plugin-process = "2.2.1"
tauri-plugin-shell = "2.2.1"
tauri-plugin-opener = "2.2.7"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# Strip expensive panic clean-up logic
panic = "abort"
# Compile crates one after another so the compiler can optimize better
codegen-units = 1
# Enables link to optimizations
lto = true
# Optimize for binary size
opt-level = "s"
# Remove debug symbols
strip = true

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = "2"

name: main

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform:
          # macos-x64
          - macos-13
          # macos-aarch64
          - macos-14
          # linux-x64
          - ubuntu-22.04
          # linux-aarch64
          - ubuntu-22.04-arm
          # windows-x64
          - windows-2022

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: |
            ${{ env.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-${{ runner.arch }}-

      # prepare-env: Tauri deps for linux.
      - if: matrix.platform == 'ubuntu-22.04' || matrix.platform == 'ubuntu-22.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf
        shell: bash

      # prepare-env: Tauri deps for linux.
      # - if: matrix.platform == 'ubuntu-22.04'
      #   run: |
      #     sudo apt-cache madison libwebkit2gtk-4.1-dev

      #     # download old versions because of EGL issues, see https://github.com/h3poteto/fedistar/issues/1717
      #     mkdir -p /tmp/ubuntu-packages
      #     cd /tmp/ubuntu-packages
      #     wget http://launchpadlibrarian.net/663254796/libwebkit2gtk-4.0-37_2.38.6-0ubuntu0.20.04.1_amd64.deb
      #     wget http://launchpadlibrarian.net/663254788/libwebkit2gtk-4.0-dev_2.38.6-0ubuntu0.20.04.1_amd64.deb
      #     wget http://launchpadlibrarian.net/663254793/libjavascriptcoregtk-4.0-18_2.38.6-0ubuntu0.20.04.1_amd64.deb
      #     wget http://launchpadlibrarian.net/663254785/libjavascriptcoregtk-4.0-dev_2.38.6-0ubuntu0.20.04.1_amd64.deb
      #     wget http://launchpadlibrarian.net/687104015/libwebp6_0.6.1-2ubuntu0.20.04.3_amd64.deb
      #     wget http://launchpadlibrarian.net/570430457/libicu66_66.1-2ubuntu2.1_amd64.deb
      #     wget http://launchpadlibrarian.net/663254780/gir1.2-javascriptcoregtk-4.0_2.38.6-0ubuntu0.20.04.1_amd64.deb
      #     wget http://launchpadlibrarian.net/663254782/gir1.2-webkit2-4.0_2.38.6-0ubuntu0.20.04.1_amd64.deb
      #     sudo apt-get install -y /tmp/ubuntu-packages/*.deb
      #   shell: bash

      # # prepare-env: Tauri deps for linux.
      # - if: matrix.platform == 'ubuntu-22.04-arm'
      #   run: |
      #     sudo apt-cache madison libwebkit2gtk-4.1-dev

      #     # download old versions because of EGL issues, see https://github.com/h3poteto/fedistar/issues/1717
      #     mkdir -p /tmp/ubuntu-packages
      #     cd /tmp/ubuntu-packages
      #     wget http://launchpadlibrarian.net/663288580/libwebkit2gtk-4.0-37_2.38.6-0ubuntu0.20.04.1_arm64.deb
      #     wget http://launchpadlibrarian.net/663288575/libwebkit2gtk-4.0-dev_2.38.6-0ubuntu0.20.04.1_arm64.deb
      #     wget http://launchpadlibrarian.net/663288577/libjavascriptcoregtk-4.0-18_2.38.6-0ubuntu0.20.04.1_arm64.deb
      #     wget http://launchpadlibrarian.net/663288572/libjavascriptcoregtk-4.0-dev_2.38.6-0ubuntu0.20.04.1_arm64.deb
      #     wget http://launchpadlibrarian.net/687104098/libwebp6_0.6.1-2ubuntu0.20.04.3_arm64.deb
      #     wget http://launchpadlibrarian.net/570432260/libicu66_66.1-2ubuntu2.1_arm64.deb
      #     wget http://launchpadlibrarian.net/663288567/gir1.2-javascriptcoregtk-4.0_2.38.6-0ubuntu0.20.04.1_arm64.deb
      #     wget http://launchpadlibrarian.net/663288569/gir1.2-webkit2-4.0_2.38.6-0ubuntu0.20.04.1_arm64.deb
      #     sudo apt-get install -y /tmp/ubuntu-packages/*.deb
      #   shell: bash

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
            !src-tauri/target/release/bundle/
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/tauri.conf.json') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-

      - run: ./script/prepare-env
        shell: bash

      - run: ./script/build
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: -
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: wadpunk-${{ matrix.platform }}-${{ runner.arch }}
          retention-days: 7
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.nsis.zip
            src-tauri/target/release/bundle/nsis/*.nsis.zip.sig
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz.sig

  release_please:
    needs:
      - build

    runs-on: ubuntu-latest

    outputs:
      release_please_version: ${{ steps.release_please.outputs.version }}
      release_please_tag_name: ${{ steps.release_please.outputs.tag_name }}
      release_please_release_created: ${{ steps.release_please.outputs.release_created }}

    steps:
      - uses: actions/checkout@v4

      - uses: googleapis/release-please-action@v4
        id: release_please
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: node

  deploy:
    needs:
      - release_please

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        if: ${{ needs.release_please.outputs.release_please_release_created == 'true' }}

      # prepare-env: Push as github bot.
      # https://github.community/t/github-actions-bot-email-address/17204/5
      - name: Prep for git push
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        shell: bash
        if: ${{ needs.release_please.outputs.release_please_release_created == 'true' }}

      - uses: actions/download-artifact@v4
        if: ${{ needs.release_please.outputs.release_please_release_created == 'true' }}

      # This is CI specific, artifacts don't seem to be stored with a helpful
      # path.
      - run: |
          mkdir -p src-tauri/target/release/bundle
          cp -rl wadpunk-windows-2022-X64/* src-tauri/target/release/bundle
          cp -rl wadpunk-macos-13-X64/* src-tauri/target/release/bundle
          cp -rl wadpunk-macos-14-ARM64/* src-tauri/target/release/bundle
          cp -rl wadpunk-ubuntu-22.04-X64/* src-tauri/target/release/bundle
          cp -rl wadpunk-ubuntu-22.04-arm-ARM64/* src-tauri/target/release/bundle
        shell: bash
        if: ${{ needs.release_please.outputs.release_please_release_created == 'true' }}

      - run: ./script/deploy "${{ needs.release_please.outputs.release_please_version }}" "${{ needs.release_please.outputs.release_please_tag_name }}"
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ needs.release_please.outputs.release_please_release_created == 'true' }}
